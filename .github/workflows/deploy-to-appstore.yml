name: Deploy to App Store

on:
  push:
    branches:
      - claude/fix-foreflight-sentry-display-oexPM
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          ls /Applications/ | grep -i xcode
          XCODE_PATH=$(ls -d /Applications/Xcode_26* 2>/dev/null | head -1 || ls -d /Applications/Xcode_16* 2>/dev/null | sort -V | tail -1 || ls -d /Applications/Xcode* 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install first launch components
        run: xcodebuild -runFirstLaunch

      - name: Set up App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$ASC_API_KEY_BASE64" | base64 --decode -o ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | python3 -c "import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))" > $CERTIFICATE_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | python3 -c "import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))" > ~/Library/MobileDevice/Provisioning\ Profiles/eca2bf89-ed32-42b4-b8bd-ac25e67a526b.mobileprovision

          # Convert P12 to legacy format for macOS 14 compatibility
          openssl pkcs12 -in $CERTIFICATE_PATH -out /tmp/cert.pem -passin pass:$P12_PASSWORD -passout pass:temp123 -legacy 2>/dev/null || \
          openssl pkcs12 -in $CERTIFICATE_PATH -out /tmp/cert.pem -passin pass:$P12_PASSWORD -passout pass:temp123
          openssl pkcs12 -export -in /tmp/cert.pem -out $CERTIFICATE_PATH -passin pass:temp123 -passout pass:$P12_PASSWORD
          rm /tmp/cert.pem

          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Archive app
        run: |
          xcodebuild archive \
            -project "Tally-Ho.xcodeproj" \
            -scheme "Tally-Ho" \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="QVLT3KZ5QL" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            "PROVISIONING_PROFILE=eca2bf89-ed32-42b4-b8bd-ac25e67a526b" \
            ENABLE_PREVIEWS=NO

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"\>
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>QVLT3KZ5QL</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.simon.tallyoh</key>
                  <string>eca2bf89-ed32-42b4-b8bd-ac25e67a526b</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Read build number
        id: build_info
        run: |
          BUILD=$(xcodebuild -project "Tally-Ho.xcodeproj" -scheme "Tally-Ho" -showBuildSettings 2>/dev/null | awk '/CURRENT_PROJECT_VERSION/{print $3; exit}')
          echo "build=$BUILD" >> $GITHUB_OUTPUT

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/export/*.ipa \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee /tmp/altool_output.txt

      - name: Notify on commit
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD: ${{ steps.build_info.outputs.build }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            BODY="✅ Build $BUILD uploaded to App Store Connect. It will appear in TestFlight once Apple finishes processing (usually 5–15 min)."
          else
            BODY="❌ Build $BUILD failed to upload. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          fi
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="$BODY"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
